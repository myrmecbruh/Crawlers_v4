<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b10"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png">
<title>Crawlers v4</title>
<style>
:root{--bg:#0b0b10;--pn:#15151c;--bx:#1d1d27;--ln:#33333f;--tx:#cfcabd;--dm:#7d7a72;--ac:#f0c040;--bad:#e0605a;--good:#7fc08a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;overscroll-behavior:none}
#app{display:flex;flex-direction:row;height:100vh;height:100dvh}
@media (orientation:portrait){#app{flex-direction:column}}
#view,#ui{flex:1 1 50%;min-width:0;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated;cursor:crosshair}
#top{position:absolute;left:0;right:0;top:0;padding:6px 8px;background:linear-gradient(#0b0b10e0,#0b0b1000);pointer-events:none}
#bar{display:flex;gap:6px;flex-wrap:nowrap;pointer-events:auto;width:max-content}#bar span{display:flex;gap:2px}
#bar button{width:31px;height:30px;padding:0;margin:0;text-align:center}
.ban{position:absolute;left:8px;right:8px;top:42%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;z-index:5}
.ban.show{opacity:1;transform:none}.ban b{display:inline-block;background:#0b0b10d8;border:1px solid var(--ac);color:var(--ac);padding:6px 14px;font-size:15px;letter-spacing:.04em}
.ban span{display:inline-block;margin-top:3px;background:#0b0b10c0;padding:2px 10px;color:var(--tx);font-size:12px}
.ban.bad b{border-color:var(--bad);color:var(--bad)}.ban.good b{border-color:var(--good);color:var(--good)}
#thr{height:18px;line-height:18px;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #000;pointer-events:none;font-size:12px}
#thr .t{display:inline-block;width:8px;height:8px;margin-right:2px;border:1px solid #6a3030;background:#1a0e0e;vertical-align:middle}#thr .t.f{background:#e04040;border-color:#ff8080}
#fps{display:inline-block;width:17ch;margin-left:10px;color:#b8b4a8;font-variant-numeric:tabular-nums}
#date{height:20px;line-height:20px;margin-top:4px;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #000;pointer-events:none}
#ui{display:flex;flex-direction:column;background:var(--pn);border-left:1px solid var(--ln)}
@media (orientation:portrait){#ui{border-left:0;border-top:1px solid var(--ln)}}
#tabs{display:flex;border-bottom:1px solid var(--ln)}#tabs button{flex:1;border:0;border-radius:0;padding:10px 2px;background:none}
#tabs button.on{background:var(--bx);color:var(--ac);box-shadow:inset 0 -2px var(--ac)}
#panel{flex:1;overflow-y:auto;padding:8px 16px 24px;-webkit-overflow-scrolling:touch}
button{font:inherit;color:var(--tx);background:var(--bx);border:1px solid var(--ln);border-radius:3px;padding:6px 9px;margin:2px 2px 2px 0;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button{height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
button.big{width:100%;height:42px;padding:0 18px;font-weight:bold;margin:6px 0}
.in{height:100%}.clip .in{overflow:hidden}.scroll .in{overflow-y:auto}.box{overflow:hidden}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}
.grid4 button,.grid3 button{width:100%;margin:0}
button.mem{height:46px;text-align:left;line-height:1.3;font-size:12px}button.goal{font-size:12px}
.txt2{height:38px;overflow:hidden;font-size:12px;line-height:1.5}
.w14{width:16ch}.w10{width:11ch}button.bad{border-color:var(--bad);color:var(--bad)}.small{font-size:11px;height:16px;overflow:hidden;white-space:nowrap}
.chip.tk{width:13ch;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.chip.tk b{float:right}
.chip.pend{width:21ch;overflow:hidden}.chip.crd{width:15ch;overflow:hidden}
.box{background:var(--bx);border:1px solid var(--ln);border-radius:3px;padding:8px 10px;margin:0 0 8px}
.row{display:block;width:100%;height:52px;text-align:left;margin:0 0 4px;padding:6px 10px;line-height:1.45}
.row b{display:inline-block;width:8ch;overflow:hidden;vertical-align:bottom}
.dim{color:var(--dm)}i{color:var(--dm)}.pp{color:var(--ac)}.po{color:#44444f}
.nd{display:inline-block;margin-right:8px;white-space:nowrap;font-size:11px}.row .nd{width:auto}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:3px;padding:1px 6px;margin:2px 4px 2px 0;white-space:nowrap}
.chip i,button i{display:inline-block;width:8px;height:8px;margin-right:5px}
.chip a{color:var(--bad);cursor:pointer;margin-left:4px}.scar{border-color:var(--bad);color:var(--bad)}
.k-bane{color:var(--bad)}.k-boon{color:var(--good)}.k-arrival{color:#8fb8e0}.k-blank{color:var(--dm)}
table{border-collapse:collapse;margin-top:4px}td{padding:1px 12px 1px 0;vertical-align:top}td:first-child{color:var(--dm)}
.bill{margin:4px 0 6px}.bill .bn{height:18px}.bill .grid3{margin:2px 0}.bill button.mat{height:26px;padding:0 4px;font-size:11px;display:flex;align-items:center;text-align:left}
.mat .mn{flex:1;overflow:hidden;text-overflow:ellipsis}.mat .mq{width:3ch;text-align:right;color:var(--ac)}.mat .mh{width:3ch;text-align:right;color:var(--dm);font-variant-numeric:tabular-nums}
.bill .bn{display:flex}.bnn{flex:1}.bt{width:12ch;text-align:right;font-variant-numeric:tabular-nums}
.crow{display:flex;height:64px;border-top:1px solid #2a2a35;padding:4px 0;overflow:hidden;font-size:12px;line-height:1.45}.crow.hd{height:22px;border:0;color:var(--dm)}
.crow .cn{flex:1;overflow:hidden}.crow .cc{width:5ch;text-align:center;font-variant-numeric:tabular-nums}
span.small2{font-size:11px;color:var(--dm)}
div.goal{height:40px;overflow:hidden;font-size:12px;line-height:1.5;border-top:1px solid #2a2a35;padding-top:2px}
div.line{height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.mat.have{background:#24301f;border-color:#6f9a52;color:#e4f0d4}button.mat.have .mh{color:#a8d888;font-weight:bold}
#bar button.wait{border-style:dashed;color:var(--ac)}
button.press{background:#2e2c22;border-color:var(--ac)}
@keyframes flash{0%{background:var(--ac);color:#15151c}100%{background:var(--bx)}}button.flash,a.flash{animation:flash .26s ease-out}.log div{padding:1px 0;border-bottom:1px solid #22222c;font-size:12px;overflow-wrap:anywhere}
</style></head><body>
<div id="app">
 <div id="view"><canvas id="cv"></canvas>
  <div id="top"><div id="bar">
   <span id="spd"><button data-a="speed" data-v="0">❚❚</button><button data-a="speed" data-v="1">1×</button><button data-a="speed" data-v="4">4×</button><button data-a="speed" data-v="16">16×</button></span>
   <span><button data-a="zoom" data-v="-1" title="Zoom out">−</button><button data-a="zoom" data-v="1" title="Zoom in">+</button><button data-a="turn" data-v="-1" title="Quarter turn left (Q); or drag with two fingers, the right button or shift">⟲</button><button data-a="turn" data-v="1" title="Quarter turn right (E)">⟳</button><button id="tilt" data-a="tilt" title="Raised view (R)">⤒</button><button data-a="home" title="Back to camp">⌂</button><button id="snd" data-a="sound" title="Sound and music on or off">♪</button></span></div><div id="date"><span id="dtxt"></span><span id="fps"></span></div><div id="thr"></div></div>
  <div id="banner" class="ban"></div>
 </div>
 <div id="ui">
  <div id="tabs"><button data-a="tab" data-v="colony">Colony</button><button data-a="tab" data-v="orders">Orders</button><button data-a="tab" data-v="party">Party</button><button data-a="tab" data-v="cards">Cards</button><button data-a="tab" data-v="log">Log</button></div>
  <div id="panel"></div>
 </div>
</div>
<script>
// Load the game scripts stamped with the published version, so an update is never served from an old cache.
(function(){var S=['data','world','sim','art','render','sound','ui'];
 function go(v){window.VERSION=v;var i=0;(function next(){if(i>=S.length)return;var s=document.createElement('script');s.src='js/'+S[i++]+'.js'+(v?'?v='+encodeURIComponent(v):'');s.onload=next;document.body.appendChild(s);})();}
 fetch('version.txt?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){go(t.trim());},function(){go('');});})();
</script>
</body></html>
