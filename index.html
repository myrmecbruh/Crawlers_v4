<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b10"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png">
<title>Crawlers v4</title>
<style>
:root{--bg:#0b0b10;--pn:#15151c;--bx:#1d1d27;--ln:#33333f;--tx:#cfcabd;--dm:#7d7a72;--ac:#f0c040;--bad:#e0605a;--good:#7fc08a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;overscroll-behavior:none}
#app{display:flex;flex-direction:row;height:100vh;height:100dvh}
@media (orientation:portrait){#app{flex-direction:column}}
#view,#ui{flex:1 1 50%;min-width:0;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated;cursor:crosshair}
#top{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(#0b0b10e0,#0b0b1000);pointer-events:none}
#top>*{pointer-events:auto}#date{flex:1 1 auto;min-width:10ch;text-shadow:0 1px 2px #000}
#ui{display:flex;flex-direction:column;background:var(--pn);border-left:1px solid var(--ln)}
@media (orientation:portrait){#ui{border-left:0;border-top:1px solid var(--ln)}}
#tabs{display:flex;border-bottom:1px solid var(--ln)}#tabs button{flex:1;border:0;border-radius:0;padding:10px 2px;background:none}
#tabs button.on{background:var(--bx);color:var(--ac);box-shadow:inset 0 -2px var(--ac)}
#panel{flex:1;overflow-y:auto;padding:8px 16px 24px;-webkit-overflow-scrolling:touch}
button{font:inherit;color:var(--tx);background:var(--bx);border:1px solid var(--ln);border-radius:3px;padding:6px 9px;margin:2px 2px 2px 0;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button.big{padding:10px 18px;font-weight:bold}
.box{background:var(--bx);border:1px solid var(--ln);border-radius:3px;padding:8px 10px;margin:0 0 8px}
.row{display:block;width:100%;text-align:left;margin:0 0 4px;padding:8px 10px}
.dim{color:var(--dm)}i{color:var(--dm)}.pp{color:var(--ac)}.po{color:#44444f}
.nd{display:inline-block;margin-right:10px;white-space:nowrap;font-size:11px}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:3px;padding:1px 6px;margin:2px 4px 2px 0;white-space:nowrap}
.chip i,button i{display:inline-block;width:8px;height:8px;margin-right:5px}
.chip a{color:var(--bad);cursor:pointer;margin-left:4px}.scar{border-color:var(--bad);color:var(--bad)}
.k-bane{color:var(--bad)}.k-boon{color:var(--good)}.k-arrival{color:#8fb8e0}.k-blank{color:var(--dm)}
table{border-collapse:collapse;margin-top:4px}td{padding:1px 12px 1px 0;vertical-align:top}td:first-child{color:var(--dm)}
.bill{margin:2px 0}.bill button{padding:3px 7px}.log div{padding:1px 0;border-bottom:1px solid #22222c;font-size:12px;overflow-wrap:anywhere}
</style></head><body>
<div id="app">
 <div id="view"><canvas id="cv"></canvas>
  <div id="top"><span id="date"></span>
   <span id="spd"><button data-a="speed" data-v="0">❚❚</button><button data-a="speed" data-v="1">1×</button><button data-a="speed" data-v="4">4×</button><button data-a="speed" data-v="16">16×</button></span>
   <span><button data-a="zoom" data-v="-1" title="Zoom out">−</button><button data-a="zoom" data-v="1" title="Zoom in">+</button><button data-a="turn" data-v="-1" title="Turn left 45° (Q); or drag with two fingers, the right button or shift">⟲</button><button data-a="turn" data-v="1" title="Turn right (E)">⟳</button><button id="tilt" data-a="tilt" title="Raised view (R)">⤒</button></span></div>
 </div>
 <div id="ui">
  <div id="tabs"><button data-a="tab" data-v="colony">Colony</button><button data-a="tab" data-v="orders">Orders</button><button data-a="tab" data-v="party">Party</button><button data-a="tab" data-v="cards">Cards</button><button data-a="tab" data-v="log">Log</button></div>
  <div id="panel"></div>
 </div>
</div>
<script>
// Load the game scripts stamped with the published version, so an update is never served from an old cache.
(function(){var S=['data','world','sim','art','render','ui'];
 function go(v){window.VERSION=v;var i=0;(function next(){if(i>=S.length)return;var s=document.createElement('script');s.src='js/'+S[i++]+'.js'+(v?'?v='+encodeURIComponent(v):'');s.onload=next;document.body.appendChild(s);})();}
 fetch('version.txt?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){go(t.trim());},function(){go('');});})();
</script>
</body></html>
